# The prototype's workload: a stateless, multi-arch (amd64/arm64) HTTP echo.
# Rules for any stack singleton runs:
#  - no `restart:` policy and no healthcheck: ic-healthd must never restart an
#    instance the agent fenced (the agent supervises health itself);
#  - boot.autostart false: a rebooting host must not bring a second copy up
#    (the agent also enforces this after every `up`);
#  - containers only: the self-fence's last resort is cgroup.kill.
services:
  whoami:
    image: docker.io/traefik/whoami:v1.12.0
    restart: "no"
    x-incus:
      boot.autostart: "false"
    networks:
      - incusbr0

networks:
  incusbr0:
    external: true
    name: incusbr0
