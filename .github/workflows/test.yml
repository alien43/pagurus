name: Go Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest   # amd64: -race needs it (it cannot run on rpi5's 47-bit VA kernel)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install etcd
        run: |
          ETCD_VER=v3.6.12
          DOWNLOAD_URL=https://github.com/etcd-io/etcd/releases/download
          curl -L ${DOWNLOAD_URL}/${ETCD_VER}/etcd-${ETCD_VER}-linux-amd64.tar.gz -o /tmp/etcd.tar.gz
          mkdir -p /tmp/etcd-download
          tar -xf /tmp/etcd.tar.gz -C /tmp/etcd-download --strip-components=1
          sudo cp /tmp/etcd-download/etcd /tmp/etcd-download/etcdctl /usr/local/bin/
          etcd --version

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet and build
        run: |
          go vet ./...
          CGO_ENABLED=0 go build ./...

      - name: Test (race)
        run: go test -race -count=1 -v ./... 2>&1 | tee test.log; test ${PIPESTATUS[0]} -eq 0

      # testutil.Etcd skips when no etcd binary is found; in CI that would turn
      # every integration test into a silent pass.
      - name: No skipped tests
        run: '! grep -- "--- SKIP" test.log'
