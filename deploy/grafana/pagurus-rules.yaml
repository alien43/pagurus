# Grafana alert rules for pagurus: the four conditions that need a human, and
# two more for replicating services (README "Replication"): a stale replica,
# and preserved orphan data. Their metrics exist only where replicate is set.
# PagurusReplicaStale's 1h is for the default replicate.interval 15m (4 rounds
# missed); keep it under the service's max_staleness.
# Grafana file provisioning (provisioning/alerting/); the metrics come from a
# Prometheus job scraping every agent's --metrics-addr. Set datasourceUid to
# your Prometheus datasource and folder to yours.
#
# PagurusTwoRunning waits 1m: each agent samples its cgroupfs every 5s and
# Prometheus scrapes every 15s, so during a planned move the old member can
# still read 1 for ~20s after the new one starts. A real second copy that
# survives the agents' local guard lasts longer than that.
#
# PagurusNobodyRunning waits 3m: more than 2 x (TTL 20s + grace 10s +
# unverified_wait 40s) = 140s, the longest normal failover at the default
# timing, so ordinary failovers (25-40s) and moves (~10s) never page.
apiVersion: 1

groups:
  - orgId: 1
    name: pagurus
    folder: Infrastructure
    interval: 30s
    rules:
      - uid: pagurus-two-running
        title: PagurusTwoRunning
        condition: B
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "pagurus {{ $labels.svc }}: the workload runs on more than one member (from each member's own cgroupfs) — the at-most-one invariant broke; run 'pagurus status' and stop the copy that does not hold the office"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: derpa48qhefpcf
            model:
              editorMode: code
              expr: count by (svc) (pagurus_local_running > 0) > bool 1
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold

      - uid: pagurus-fence-blocked
        title: PagurusFenceBlocked
        condition: B
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "pagurus {{ $labels.svc }}: the new leader is blocked on a member it cannot fence (fence.unverified=block) — the service is down until that member returns or 'pagurus fence-ack --member <m>' after checking it is down"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: derpa48qhefpcf
            model:
              editorMode: code
              expr: max by (svc) (pagurus_fence_blocked) == bool 1
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold

      - uid: pagurus-unfit
        title: PagurusUnfit
        condition: B
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "pagurus {{ $labels.svc }} on {{ $labels.member }}: unfit, withholding its watchdog pet (a self-fence failed or conch stopped petting) — a possible second copy; only the watchdog stands between"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: derpa48qhefpcf
            model:
              editorMode: code
              expr: min by (svc, member) (pagurus_fit) == bool 0
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold

      - uid: pagurus-nobody-running
        title: PagurusNobodyRunning
        condition: B
        for: 3m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "pagurus {{ $labels.svc }}: no member runs the workload for > 3m although at least two agents report — failover is not happening; run 'pagurus status'"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: derpa48qhefpcf
            model:
              editorMode: code
              expr: (count by (svc) (pagurus_local_running > 0) or on (svc) (0 * count by (svc) (pagurus_fit))) == bool 0 and on (svc) count by (svc) (pagurus_fit) >= 2
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold

      - uid: pagurus-replica-stale
        title: PagurusReplicaStale
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pagurus {{ $labels.svc }}: {{ $labels.member }}'s replica is over an hour old — a failover to it would lose that much, or be refused by max_staleness; check the leader's snapshot rounds and this member's pulls ('pagurus status')"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: derpa48qhefpcf
            model:
              editorMode: code
              expr: max by (svc, member) (pagurus_replica_age_seconds) > bool 3600
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold

      - uid: pagurus-orphaned-data
        title: PagurusOrphanedData
        condition: B
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pagurus {{ $labels.svc }}: {{ $labels.member }} preserved writes the leader never had as a <volume>-orphaned-* volume (rule 4) — decide whether anything in it matters, then delete it by hand; pagurus never merges or prunes it"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: derpa48qhefpcf
            model:
              editorMode: code
              expr: max by (svc, member) (pagurus_orphaned_volumes) > bool 0
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
